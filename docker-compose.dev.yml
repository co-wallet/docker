# Dev override: hot-reload for backend and frontend
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  db:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  backend:
    image: co-wallet-backend-dev:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend.dev
    volumes:
      - ../backend:/app
      - backend_go_modules:/go/pkg/mod
      - backend_go_build_cache:/root/.cache/go-build
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/cowallet?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      PORT: 8080
      APP_URL: ${APP_URL:-http://localhost:3000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@co-wallet.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@co-wallet.local}

  frontend:
    image: co-wallet-frontend-dev:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend.dev
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_npm_cache:/root/.npm
    ports: !override
      - "${APP_PORT:-3000}:3000"
    environment:
      VITE_API_URL: http://backend:8080

volumes:
  backend_go_modules:
  backend_go_build_cache:
  frontend_node_modules:
  frontend_npm_cache:
